{{define "containers.html"}}
{{if .Error}}
  <p class="text-sm text-rose-400">Error: {{.Error}}</p>
{{else if not .Containers}}
  <p class="text-sm text-slate-500">No containers.</p>
{{else}}
<div class="overflow-x-auto">
  <table class="w-full text-sm">
    <thead class="text-left text-xs uppercase tracking-wide text-slate-500">
      <tr>
        <th class="py-2 pr-4 font-medium">Name</th>
        <th class="py-2 pr-4 font-medium">Image</th>
        <th class="py-2 pr-4 font-medium">State</th>
        <th class="py-2 pr-4 font-medium">Status</th>
        <th class="py-2 pr-4 font-medium">Ports</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-800">
      {{range .Containers}}
      <tr>
        <td class="py-2 pr-4 font-mono text-slate-200">{{.Name}}</td>
        <td class="py-2 pr-4 text-slate-400">{{.Image}}</td>
        <td class="py-2 pr-4">
          <span class="inline-flex rounded-full px-2 py-0.5 text-xs
            {{if eq .State "running"}}bg-emerald-500/15 text-emerald-300
            {{else if eq .State "exited"}}bg-rose-500/15 text-rose-300
            {{else}}bg-slate-700/40 text-slate-300{{end}}">
            {{.State}}
          </span>
        </td>
        <td class="py-2 pr-4 text-slate-400">{{.Status}}</td>
        <td class="py-2 pr-4 font-mono text-xs text-slate-400">{{.Ports}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
{{end}}
