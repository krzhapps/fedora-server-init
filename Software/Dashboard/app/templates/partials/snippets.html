{{define "snippets.html"}}
{{if .Error}}
  <p class="text-sm text-rose-400 mb-3">{{.Error}}</p>
{{end}}

<details class="mb-4">
  <summary class="cursor-pointer text-sm font-medium text-indigo-400 hover:text-indigo-300 select-none w-fit">
    + New Snippet
  </summary>
  <form hx-post="/snippets" hx-target="#snippets-panel" hx-swap="innerHTML" class="mt-3 space-y-2">
    <textarea
      name="content"
      rows="4"
      placeholder="Paste or type snippet…"
      class="w-full rounded-lg bg-slate-800 border border-slate-700 text-sm text-slate-200 placeholder-slate-500 p-2.5 resize-none focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono"></textarea>
    <button
      type="submit"
      class="px-3 py-1.5 text-sm rounded-md bg-indigo-600 hover:bg-indigo-500 text-white font-medium">
      Add
    </button>
  </form>
</details>

{{if not .Snippets}}
  <p class="text-sm text-slate-500">No snippets yet.</p>
{{else}}
  <ul class="space-y-2">
    {{range .Snippets}}
    <li class="relative rounded-lg bg-slate-800/60 border border-slate-700/50 p-3 pr-28">
      <pre class="text-xs text-slate-300 font-mono whitespace-pre-wrap break-all max-h-28 overflow-y-auto">{{.Content}}</pre>
      <div class="absolute top-2 right-2 flex gap-1">
        <button
          onclick="copySnippet(this)"
          class="px-2 py-1 text-xs rounded bg-slate-700 hover:bg-slate-600 text-slate-300">
          Copy
        </button>
        <button
          hx-delete="/snippets/{{.ID}}"
          hx-target="#snippets-panel"
          hx-swap="innerHTML"
          hx-confirm="Delete this snippet?"
          class="px-2 py-1 text-xs rounded bg-rose-700/70 hover:bg-rose-600 text-rose-100">
          Delete
        </button>
      </div>
    </li>
    {{end}}
  </ul>
{{end}}
{{end}}
