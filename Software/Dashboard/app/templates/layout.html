{{define "layout.html"}}<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/htmx.min.js" defer></script>
  <script>
    function copySnippet(btn) {
      const text = btn.closest('li').querySelector('pre').textContent;
      const done = () => {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done));
      } else {
        fallback(text, done);
      }
    }
    function fallback(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } finally { document.body.removeChild(ta); }
    }
  </script>
</head>
<body class="h-full text-slate-100 font-sans antialiased">
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <h1 class="text-lg font-semibold tracking-tight">Server Dashboard</h1>
      <span class="text-xs text-slate-400">fedora-server-init</span>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-6 py-8 space-y-8">
    {{template "index.html" .Data}}
  </main>
</body>
</html>
{{end}}
