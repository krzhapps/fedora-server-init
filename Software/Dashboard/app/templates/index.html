{{define "index.html"}}
<div class="grid grid-cols-2 gap-6">
{{range .Modules}}
  {{if eq .Panel "containers.html"}}
  <section class="rounded-xl border border-slate-800 bg-slate-900/40 p-6 shadow-sm">
    <h2 class="text-base font-semibold text-slate-200 mb-4">{{.Name}}</h2>
    <div hx-get="/containers/rows" hx-trigger="load, every 5s" hx-swap="innerHTML">
      <p class="text-sm text-slate-500">Loading containers…</p>
    </div>
  </section>
  {{else if eq .Panel "snippets.html"}}
  <section class="rounded-xl border border-slate-800 bg-slate-900/40 p-6 shadow-sm">
    <h2 class="text-base font-semibold text-slate-200 mb-4">{{.Name}}</h2>
    <div id="snippets-panel" hx-get="/snippets" hx-trigger="load" hx-swap="innerHTML">
      <p class="text-sm text-slate-500">Loading snippets…</p>
    </div>
  </section>
  {{end}}
{{end}}
</div>
{{range .Modules}}
  {{if eq .Panel "files.html"}}
  <section class="rounded-xl border border-slate-800 bg-slate-900/40 p-6 shadow-sm">
    <h2 class="text-base font-semibold text-slate-200 mb-4">{{.Name}}</h2>
    <div hx-get="/files?path=" hx-trigger="load" hx-swap="innerHTML">
      <p class="text-sm text-slate-500">Loading media…</p>
    </div>
  </section>
  {{end}}
{{end}}
{{end}}
